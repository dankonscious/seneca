# -----------------------------------------------------------------------------
# Workflow: Deploy
# Steps:
#   1a. FTP deploy     ─┐ parallel
#   1b. AWS deploy     ─┘
#   2.  QA check on the recently committed folder
#   3.  If QA fails → notify Slack
# -----------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches:
      - main
      - master

jobs:

  # ---------------------------------------------------------------------------
  # Job 1a: Deploy via FTP
  # ---------------------------------------------------------------------------
  deploy-ftp:
    name: FTP Deploy
    uses: EnclaveLLC/automation-workflow/.github/workflows/ftp_deploy.yml@main
    permissions:
      contents: write
    secrets:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  # ---------------------------------------------------------------------------
  # Job 1b: Deploy to AWS (runs in parallel with deploy-ftp)
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: AWS Deploy
    uses: EnclaveLLC/automation-workflow/.github/workflows/aws_deploy.yml@main
    permissions:
      contents: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ---------------------------------------------------------------------------
  # Job 2: QA Validation (runs after both deploys complete)
  # ---------------------------------------------------------------------------
  qa-check:
    name: QA Validation
    needs: [deploy-ftp, deploy-aws]
    uses: EnclaveLLC/automation-workflow/.github/workflows/qa_check.yml@main
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Job 3: Notify Slack if QA failed
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify Slack on Failure
    needs: qa-check
    if: needs.qa-check.outputs.qa_passed == 'false'
    uses: EnclaveLLC/automation-workflow/.github/workflows/slack.yml@main
    permissions:
      contents: write
    with:
      message: ${{ needs.qa-check.outputs.failure_message }}
