# -----------------------------------------------------------------------------
# Workflow: Deploy
# Steps:
#   1a. FTP deploy     ─┐ parallel
#   1b. AWS deploy     ─┘
#   2.  QA check on the recently committed folder
#   3.  If QA fails → notify Slack
# -----------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches:
      - main
      - master

jobs:

  # ---------------------------------------------------------------------------
  # Job 0: Detect if push originated from a merged PR and echo its body
  # ---------------------------------------------------------------------------
  pr-info:
    name: PR Info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gtmetrix_url: ${{ steps.extract.outputs.gtmetrix_url }}
      issue_url: ${{ steps.extract.outputs.issue_url }}
    steps:
      - name: Fetch PR body if push is from a merged PR
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_DATA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0] // empty')

          if [ -z "$PR_DATA" ]; then
            echo "This push was not associated with a pull request."
          else
            PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
            PR_BODY=$(echo "$PR_DATA" | jq -r '.body // ""')
            echo "Push originated from PR #${PR_NUMBER}"
            echo "-------- PR Body --------"
            echo "$PR_BODY"
            echo "-------------------------"

            GTMETRIX_LINKS=$(echo "$PR_BODY" | grep -oE 'https?://gtmetrix\.com/[^ )>\n]+' || true)
            ISSUE_LINKS=$(echo "$PR_BODY" | grep -oE 'https?://[^ )>\n]*(github\.com[^ )>\n]*/issues/[0-9]+|linear\.app[^ )>\n]+|jira[^ )>\n]+|atlassian\.net[^ )>\n]+)' || true)

            if [ -n "$GTMETRIX_LINKS" ]; then
              echo "---- GTmetrix Links ----"
              echo "$GTMETRIX_LINKS"
              FIRST_GTMETRIX=$(echo "$GTMETRIX_LINKS" | head -n1)
              echo "gtmetrix_url=${FIRST_GTMETRIX}" >> "$GITHUB_OUTPUT"
            else
              echo "No GTmetrix links found in PR body."
            fi

            if [ -n "$ISSUE_LINKS" ]; then
              echo "----- Issue Links ------"
              echo "$ISSUE_LINKS"
              FIRST_ISSUE=$(echo "$ISSUE_LINKS" | head -n1)
              echo "issue_url=${FIRST_ISSUE}" >> "$GITHUB_OUTPUT"
            else
              echo "No issue links found in PR body."
            fi
            echo "-------------------------"
          fi

  # ---------------------------------------------------------------------------
  # Job 1a: Deploy via FTP
  # ---------------------------------------------------------------------------
  deploy-ftp:
    name: FTP Deploy
    uses: EnclaveLLC/automation-workflow/.github/workflows/ftp_deploy.yml@main
    permissions:
      contents: write
    secrets:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  # ---------------------------------------------------------------------------
  # Job 1b: Deploy to AWS (runs in parallel with deploy-ftp)
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: AWS Deploy
    uses: EnclaveLLC/automation-workflow/.github/workflows/aws_deploy.yml@main
    permissions:
      contents: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ---------------------------------------------------------------------------
  # Job 2: GTmetrix performance check (runs after both deploys complete)
  # ---------------------------------------------------------------------------
  gtmetrix:
    name: GTmetrix Check
    needs: [deploy-ftp, deploy-aws, pr-info]
    if: needs.pr-info.outputs.gtmetrix_url != ''
    uses: EnclaveLLC/automation-workflow/.github/workflows/gtmetrix.yml
    with:
      gtmetrix_url: ${{ needs.pr-info.outputs.gtmetrix_url }}
      issue_url: ${{ needs.pr-info.outputs.issue_url }}
    secrets:
      GTMETRIX_API_KEY: ${{ secrets.GTMETRIX_API_KEY }}

  # ---------------------------------------------------------------------------
  # Job 4: QA Validation (runs after both deploys complete)
  # ---------------------------------------------------------------------------
  qa-check:
    name: QA Validation
    needs: [deploy-ftp, deploy-aws]
    uses: EnclaveLLC/automation-workflow/.github/workflows/qa_check.yml@main
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Job 5: Notify Slack if QA failed
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify Slack on Failure
    needs: qa-check
    if: needs.qa-check.outputs.qa_passed == 'false'
    uses: EnclaveLLC/automation-workflow/.github/workflows/slack.yml@main
    permissions:
      contents: write
    with:
      message: ${{ needs.qa-check.outputs.failure_message }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
