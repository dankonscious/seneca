# -----------------------------------------------------------------------------
# Workflow: Deploy
# Steps:
#   1a. FTP deploy     ─┐ parallel
#   1b. AWS deploy     ─┘
#   2.  QA check on the recently committed folder
#   3.  If QA fails → notify Slack
# -----------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches:
      - main
      - master

jobs:

  # ---------------------------------------------------------------------------
  # Job 0: Detect if push originated from a merged PR and echo its body
  # ---------------------------------------------------------------------------
  pr-info:
    name: PR Info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch PR body if push is from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_DATA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0] // empty')

          if [ -z "$PR_DATA" ]; then
            echo "This push was not associated with a pull request."
          else
            PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
            PR_BODY=$(echo "$PR_DATA" | jq -r '.body // "(no body)"')
            echo "Push originated from PR #${PR_NUMBER}"
            echo "-------- PR Body --------"
            echo "$PR_BODY"
            echo "-------------------------"
          fi

  # ---------------------------------------------------------------------------
  # Job 1a: Deploy via FTP
  # ---------------------------------------------------------------------------
  deploy-ftp:
    name: FTP Deploy
    uses: EnclaveLLC/automation-workflow/.github/workflows/ftp_deploy.yml@main
    permissions:
      contents: write
    secrets:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  # ---------------------------------------------------------------------------
  # Job 1b: Deploy to AWS (runs in parallel with deploy-ftp)
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: AWS Deploy
    uses: EnclaveLLC/automation-workflow/.github/workflows/aws_deploy.yml@main
    permissions:
      contents: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ---------------------------------------------------------------------------
  # Job 2: QA Validation (runs after both deploys complete)
  # ---------------------------------------------------------------------------
  qa-check:
    name: QA Validation
    needs: [deploy-ftp, deploy-aws]
    uses: EnclaveLLC/automation-workflow/.github/workflows/qa_check.yml@main
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Job 3: Notify Slack if QA failed
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify Slack on Failure
    needs: qa-check
    if: needs.qa-check.outputs.qa_passed == 'false'
    uses: EnclaveLLC/automation-workflow/.github/workflows/slack.yml@main
    permissions:
      contents: write
    with:
      message: ${{ needs.qa-check.outputs.failure_message }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
