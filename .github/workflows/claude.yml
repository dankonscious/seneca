name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: dankonscious/automation-workflow/.github/workflows/claude.yml@main
    permissions:
      actions: read
      issues: write
      pull-requests: read
      id-token: write
    secrets: inherit