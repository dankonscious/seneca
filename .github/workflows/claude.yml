name: Claude

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # ✅ REQUIRED FIX

jobs:
  claude:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create Pull Request (AUTOMATIC)
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          title: "${{ github.event.issue.title }}"
          body: "${{ github.event.issue.body }}"
          branch: feature/claude-${{ github.run_id }}
          commit-message: "Add test page"
          delete-branch: true

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ PR created automatically from workflow."
            })