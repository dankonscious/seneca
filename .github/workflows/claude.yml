name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        env:
          GTMETRIX_API_KEY: ${{ secrets.GTMETRIX_API_KEY }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Custom prompt with strict formatting rules
          prompt: |
            **IMPORTANT - WHEN WORKING ON ISSUES:**
            After you finish implementing the code changes and committing them, create a pull request:
            ```
            gh pr create --title "Your descriptive title" --body "## Summary
            Your summary of what was implemented.
             
            ```
            Always include a summary of changes in the PR body. 
            Do NOT include issue numbers or issue references in the PR body. 
            NEVER modify, close, resolve, or change the status of any issue.
            
            
            ** GTMETRIX RULES **
            - Include all the GTmetrix Test URLs in the PR Summary.
            - Strictly follow the exact output structure provided.
            - Do NOT rename labels.
            - Do NOT prepend any variable names, labels, identifiers, or aliases before the URLs (examples: "duplicate_url:", "ref_url:", "test_url:", etc.).
            - Do NOT add explanations, annotations, or extra formatting.
            - Only output the raw URLs exactly as provided.

            Use this exact format:

            ## GTMetrix Test URLs
            - {{url}}
            - {{url}}
            - {{url}}


            **COMMIT RULES:**
            - Do NOT add "Co-authored-by" lines to commits
            - Do NOT add "Generated with Claude Code" or similar attributions
            - Keep commits clean and professional
          
            **WHEN WORKING ON PR FEEDBACK:**
            
            Make the requested changes and commit them to the existing branch.

            Rules:

            Do NOT create a new PR
            The existing PR must be updated automatically through new commits
            Keep all changes within the current PR branch

            At the end of every response, include the related GitHub issue reference using this exact format:

            #Issue https://github.com/dankonscious/seneca/issues/103

            Additional Rules:

            Plain text only
            Do NOT use markdown hyperlinks
            Do NOT modify the format
            Do NOT use keywords such as Fixes, Closes, Resolves, or similar auto-closing references
            The issue reference is for tracking only and must NOT auto-close the issue when the PR is merged

            **WHEN FIXING CI FAILURES:**
            Fix the issues, commit the fix. The CI will automatically re-run.
           
            **WHEN RETURNING GTMETRIX HISTORY RESULT:**
            
            1. Read data ONLY from:
              gtmetrix-history.json

            2. Filter rules:
              - Include ONLY entries that match the requested URL exactly
              - Do NOT include any other URLs
              - Do NOT include partial matches

            3. Output format (STRICT):

            GTMetrix History for: <URL>
            - <Date> | Grade: <X> | Performance: <X>% | Structure: <X>%
            - <Date> | Grade: <X> | Performance: <X>% | Structure: <X>%

            4. Output rules:
              - No extra text
              - No explanations
              - No headers besides the title line
              - No empty lines
              - No commentary
              - Keep chronological order (oldest → newest)

            **OUTPUT RULES:**
          
            ## Commit Message Requirements (max 72 chars)
            - Imperative mood: "Add" not "Added"
            - Action verbs: Add, Update, Fix, Remove, Refactor, Implement
            - No articles (a, an, the)
            - No punctuation at end
            - No prefixes like "feat:", "fix:"
            - Single line only
            - NO co-author attributions

          # Enable progress tracking
          track_progress: true

          # Claude CLI arguments
          claude_args: |
            --model "claude-opus-4-5"
            --max-turns 100
            --allowedTools "Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh repo:*),Bash(npm:*),Bash(npx:*),Edit,Write,Read,Glob,Grep,LS,WebSearch,WebFetch"

      # Clean up the comment - remove the malformed "Create PR" link and trailing artifacts
      - name: Clean up Claude comment
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the latest comment from Claude on this issue
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[-1].id')

          if [ -n "$COMMENT_ID" ]; then
            # Get current comment body
            BODY=$(gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq '.body')

            # Remove the "Create PR" link and any trailing pipe/whitespace
            CLEANED=$(echo "$BODY" | sed 's/ • \[Create PR ➔\]([^)]*)//g' | sed 's/[[:space:]]*|[[:space:]]*$//')

            # Update the comment
            gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
              -X PATCH \
              -f body="$CLEANED"
          fi