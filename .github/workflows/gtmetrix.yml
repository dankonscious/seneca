name: GTMetrix on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test issue extraction against'
        required: true
        type: string

jobs:
  gtmetrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract GTmetrix Test URL from PR body
        id: extract_url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.body // ""')

          echo "=== DEBUG: PR Body ==="
          echo "$PR_BODY"

          # Extract the URL on the line immediately after "## GTmetrix Test URL"
          GTMETRIX_URL=$(echo "$PR_BODY" | grep -A1 '## GTmetrix Test URL' | tail -1 | tr -d '[:space:]')

          echo "=== FINAL: gtmetrix_url='$GTMETRIX_URL' ==="
          echo "gtmetrix_url=$GTMETRIX_URL" >> "$GITHUB_OUTPUT"
