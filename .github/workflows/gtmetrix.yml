name: GTMetrix on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test issue extraction against'
        required: true
        type: string

jobs:
  gtmetrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract duplicate_url from linked issue
        id: extract_url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.body // ""')
          PR_COMMENTS=$(gh api repos/$REPO/issues/$PR_NUMBER/comments --jq '[.[].body] | join("\n")')
          ALL_TEXT="$PR_BODY
          $PR_COMMENTS"

          ISSUE_NUMBERS=$(
            echo "$ALL_TEXT" | grep -oE '(closes|close|closed|fixes|fix|fixed|resolves|resolve|resolved|references?|refs?)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+';
            echo "$ALL_TEXT" | grep -oE "github\.com/$REPO/issues/[0-9]+" | grep -oE '[0-9]+$';
            echo "$ALL_TEXT" | grep -oE '#[0-9]+' | tr -d '#'
          )

          ISSUE_NUMBERS=$(echo "$ISSUE_NUMBERS" | sort -un)

          echo "=== DEBUG: PR Body ==="
          echo "$PR_BODY"
          echo "=== DEBUG: PR Comments ==="
          echo "$PR_COMMENTS"
          echo "=== DEBUG: Extracted Issue Numbers ==="
          echo "$ISSUE_NUMBERS"

          DUPLICATE_URL=""
          for ISSUE_NUM in $ISSUE_NUMBERS; do
            ISSUE_BODY=$(gh api repos/$REPO/issues/$ISSUE_NUM --jq '.body // ""' 2>/dev/null || echo "")
            echo "=== DEBUG: Issue #$ISSUE_NUM body ==="
            echo "$ISSUE_BODY"

            URL=$(echo "$ISSUE_BODY" | grep -oE 'duplicate_url:\s*\S+' | head -1 | sed 's/duplicate_url:[[:space:]]*//')
            echo "=== DEBUG: URL found in issue #$ISSUE_NUM: '$URL' ==="

            if [ -n "$URL" ]; then
              DUPLICATE_URL="$URL"
              echo "Found duplicate_url in issue #$ISSUE_NUM: $DUPLICATE_URL"
              break
            fi
          done

          echo "duplicate_url=$DUPLICATE_URL" >> "$GITHUB_OUTPUT"
          echo "=== FINAL: duplicate_url='$DUPLICATE_URL' ==="
