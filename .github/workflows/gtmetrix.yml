name: GTMetrix on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test issue extraction against'
        required: true
        type: string

jobs:
  gtmetrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract GTmetrix Test URL from PR body
        id: extract_url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.body // ""')

          echo "=== DEBUG: PR Body ==="
          echo "$PR_BODY"

          # Extract the URL on the line immediately after "## GTmetrix Test URL"
          GTMETRIX_URL=$(echo "$PR_BODY" | grep -A1 '## GTmetrix Test URL' | tail -1 | tr -d '[:space:]')

          echo "=== FINAL: gtmetrix_url='$GTMETRIX_URL' ==="
          echo "gtmetrix_url=$GTMETRIX_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for GTmetrix URL to go live
        env:
          GTMETRIX_URL: ${{ steps.extract_url.outputs.gtmetrix_url }}
        run: |
          if [ -z "$GTMETRIX_URL" ]; then
            echo "⚠️  No GTmetrix URL extracted — skipping live check."
            exit 0
          fi

          echo "Polling $GTMETRIX_URL until it returns HTTP 200 (following redirects)..."
          for i in $(seq 1 30); do
            STATUS_CODE=$(node -e "
              fetch('$GTMETRIX_URL', { method: 'GET', redirect: 'follow' })
                .then(r => { process.stdout.write(String(r.status)); process.exit(0); })
                .catch(() => { process.stdout.write('0'); process.exit(0); });
            ")
            echo "Attempt $i: HTTP $STATUS_CODE"

            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ URL is live."
              break
            fi

            if [ "$i" = "30" ]; then
              echo "⚠️  URL did not return 200 after 30 attempts — proceeding anyway."
            fi

            sleep 20
          done
