name: GTMetrix on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test issue extraction against'
        required: true
        type: string

jobs:
  gtmetrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract GTmetrix Test URL from PR body
        id: extract_url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.body // ""')

          echo "=== DEBUG: PR Body ==="
          echo "$PR_BODY"

          # Extract the URL on the line immediately after "## GTmetrix Test URL"
          GTMETRIX_URL=$(echo "$PR_BODY" | grep -A1 '## GTmetrix Test URL' | tail -1 | tr -d '[:space:]')

          echo "=== FINAL: gtmetrix_url='$GTMETRIX_URL' ==="
          echo "gtmetrix_url=$GTMETRIX_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for FTP Deploy to complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          echo "Looking for FTP Deploy run triggered by commit $MERGE_SHA ..."

          # Give GitHub a moment to register the FTP Deploy run
          sleep 10

          FTP_RUN_ID=""
          for i in $(seq 1 12); do
            FTP_RUN_ID=$(gh api "repos/$REPO/actions/workflows/01_ftp_deploy.yml/runs?per_page=10" \
              --jq ".workflow_runs[] | select(.head_sha == \"$MERGE_SHA\") | .id" | head -1)

            if [ -n "$FTP_RUN_ID" ]; then
              echo "Found FTP Deploy run: $FTP_RUN_ID"
              break
            fi

            echo "Attempt $i: FTP Deploy run not found yet, retrying in 10s..."
            sleep 10
          done

          if [ -z "$FTP_RUN_ID" ]; then
            echo "⚠️  Could not find FTP Deploy run for commit $MERGE_SHA — proceeding anyway."
            exit 0
          fi

          echo "Waiting for FTP Deploy run $FTP_RUN_ID to complete..."
          for i in $(seq 1 30); do
            STATUS=$(gh api "repos/$REPO/actions/runs/$FTP_RUN_ID" --jq '.status')
            CONCLUSION=$(gh api "repos/$REPO/actions/runs/$FTP_RUN_ID" --jq '.conclusion // "pending"')

            echo "Attempt $i: status=$STATUS conclusion=$CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ FTP Deploy completed successfully."
              else
                echo "⚠️  FTP Deploy finished with conclusion: $CONCLUSION — proceeding anyway."
              fi
              break
            fi

            sleep 20
          done
