name: GTMetrix on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test issue extraction against'
        required: true
        type: string

jobs:
  gtmetrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract GTmetrix Test URLs from PR body
        id: extract_url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.body // ""')

          echo "=== DEBUG: PR Body ==="
          echo "$PR_BODY"

          # Extract all URLs after "## GTmetrix Test URL(s)" heading (bare or markdown list items)
          GTMETRIX_URLS=$(echo "$PR_BODY" \
            | awk 'tolower($0) ~ /^## gtmetrix test urls?/{found=1; next} found && /https?:\/\//{match($0,/https?:\/\/[^ \t\r\n]+/); print substr($0,RSTART,RLENGTH)} found && !/https?:\/\// && /^##/{exit}' \
            | tr -d '\r')

          echo "=== FINAL: gtmetrix_urls ==="
          echo "$GTMETRIX_URLS"

          # Store as newline-delimited, encoded for GITHUB_OUTPUT
          {
            echo "gtmetrix_urls<<EOF"
            echo "$GTMETRIX_URLS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for all GTmetrix URLs to go live
        env:
          GTMETRIX_URLS: ${{ steps.extract_url.outputs.gtmetrix_urls }}
        run: |
          if [ -z "$GTMETRIX_URLS" ]; then
            echo "⚠️  No GTmetrix URLs extracted — skipping live check."
            exit 0
          fi

          check_url_live() {
            local URL="$1"
            echo "--- Polling $URL ---"
            for i in $(seq 1 30); do
              STATUS_CODE=$(node -e "
                fetch('$URL', { method: 'GET', redirect: 'follow' })
                  .then(r => { process.stdout.write(String(r.status)); process.exit(0); })
                  .catch(() => { process.stdout.write('0'); process.exit(0); });
              ")
              echo "Attempt $i: HTTP $STATUS_CODE"

              if [ "$STATUS_CODE" = "200" ]; then
                echo "✅ $URL is live."
                return 0
              fi

              if [ "$i" = "30" ]; then
                echo "⚠️  $URL did not return 200 after 30 attempts — moving on."
              fi

              sleep 20
            done
          }

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            check_url_live "$URL"
          done <<< "$GTMETRIX_URLS"


      - name: Run GTmetrix tests
        if: steps.extract_url.outputs.gtmetrix_urls != ''
        id: run_tests
        env:
          GTMETRIX_API_KEY: ${{ secrets.GTMETRIX_API_KEY }}
          GTMETRIX_URLS: ${{ steps.extract_url.outputs.gtmetrix_urls }}
        run: |
          TMPFILE=$(mktemp)
          echo "[]" > "$TMPFILE"

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "--- Testing: $URL ---"
            OUTPUT=$(node .github/scripts/gtmetrix.js "$URL" 2>&1 || true)
            echo "$OUTPUT"

            JSON_ENTRY=$(echo "$OUTPUT" | grep '^RESULT_JSON:' | sed 's/^RESULT_JSON://')
            if [ -n "$JSON_ENTRY" ]; then
              echo "$JSON_ENTRY" > /tmp/gtmetrix_entry.json
              node -e "
                const fs = require('fs');
                const arr = JSON.parse(fs.readFileSync('$TMPFILE', 'utf8'));
                const entry = JSON.parse(fs.readFileSync('/tmp/gtmetrix_entry.json', 'utf8'));
                arr.push(entry);
                fs.writeFileSync('$TMPFILE', JSON.stringify(arr, null, 2));
              "
            fi
          done <<< "$GTMETRIX_URLS"

          {
            echo "test_results<<EOF"
            cat "$TMPFILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update GTmetrix history
        if: steps.extract_url.outputs.gtmetrix_urls != ''
        env:
          TEST_RESULTS: ${{ steps.run_tests.outputs.test_results }}
        run: |
          node -e "
            const fs = require('fs');
            const histPath = 'gtmetrix-history.json';
            const existing = fs.existsSync(histPath) ? JSON.parse(fs.readFileSync(histPath, 'utf8')) : [];
            const newEntries = JSON.parse(process.env.TEST_RESULTS || '[]');
            fs.writeFileSync(histPath, JSON.stringify([...existing, ...newEntries], null, 2));
          "

          git config user.name "enc-action[bot]"
          git config user.email "enc-action[bot]@users.noreply.github.com"
          git add gtmetrix-history.json
          git commit -m "Update GTmetrix history" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
