name: GTMetrix on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test issue extraction against'
        required: true
        type: string

jobs:
  gtmetrix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract GTmetrix Test URLs from PR body
        id: extract_url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.body // ""')

          echo "=== DEBUG: PR Body ==="
          echo "$PR_BODY"

          # Extract all URLs after "## GTmetrix Test URL(s)" heading (bare or markdown list items)
          GTMETRIX_URLS=$(echo "$PR_BODY" \
            | awk 'tolower($0) ~ /^## gtmetrix test urls?/{found=1; next} found && /https?:\/\//{match($0,/https?:\/\/[^ \t\r\n]+/); print substr($0,RSTART,RLENGTH)} found && !/https?:\/\// && /^##/{exit}' \
            | tr -d '\r')

          echo "=== FINAL: gtmetrix_urls ==="
          echo "$GTMETRIX_URLS"

          # Store as newline-delimited, encoded for GITHUB_OUTPUT
          {
            echo "gtmetrix_urls<<EOF"
            echo "$GTMETRIX_URLS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for all GTmetrix URLs to go live
        env:
          GTMETRIX_URLS: ${{ steps.extract_url.outputs.gtmetrix_urls }}
        run: |
          if [ -z "$GTMETRIX_URLS" ]; then
            echo "⚠️  No GTmetrix URLs extracted — skipping live check."
            exit 0
          fi

          check_url_live() {
            local URL="$1"
            echo "--- Polling $URL ---"
            for i in $(seq 1 30); do
              STATUS_CODE=$(node -e "
                fetch('$URL', { method: 'GET', redirect: 'follow' })
                  .then(r => { process.stdout.write(String(r.status)); process.exit(0); })
                  .catch(() => { process.stdout.write('0'); process.exit(0); });
              ")
              echo "Attempt $i: HTTP $STATUS_CODE"

              if [ "$STATUS_CODE" = "200" ]; then
                echo "✅ $URL is live."
                return 0
              fi

              if [ "$i" = "30" ]; then
                echo "⚠️  $URL did not return 200 after 30 attempts — moving on."
              fi

              sleep 20
            done
          }

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            check_url_live "$URL"
          done <<< "$GTMETRIX_URLS"


      - name: Run GTmetrix tests via Claude Code
        if: steps.extract_url.outputs.gtmetrix_urls != ''
        id: claude
        env:
          GTMETRIX_API_KEY: ${{ secrets.GTMETRIX_API_KEY }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Run GTmetrix tests for the following URLs one by one:

            ${{ steps.extract_url.outputs.gtmetrix_urls }}

            For each URL:
            1. Run the test (ignore non-zero exit — performance threshold is informational only):
               node .github/scripts/gtmetrix.js <url> || true
            2. Parse the output lines for:
               - Grade    → line starting with "Grade:"
               - Performance → line starting with "Performance:"
               - Structure   → line starting with "Structure:"

            After all URLs are tested, create or update `gtmetrix-history.json` in the repository root.

            File format — a JSON array, append one entry per URL tested:
            [
              {
                "url": "<tested_url>",
                "date": "<YYYY-MM-DD>",
                "grade": "<grade>",
                "performance": <number>,
                "structure": <number>
              }
            ]

            If the file does not exist, create it as a new array.
            If it already exists, read it and append the new entries.

            After writing the file run these git commands exactly:
            1. git config user.name "enc-action[bot]"
            2. git config user.email "enc-action[bot]@users.noreply.github.com"
            3. git add gtmetrix-history.json
            4. git commit -m "Update GTmetrix history"
            5. git pull --rebase origin main
            6. git push

            **COMMIT RULES:**
            - Do NOT add "Co-authored-by" lines
            - Do NOT add "Generated with Claude Code" or any attribution
            - Keep commits clean and professional

          claude_args: |
            --model "claude-opus-4-5"
            --max-turns 30
            --allowedTools "Bash(git:*),Bash(node:*),Edit,Write,Read,Glob,Grep,LS"
